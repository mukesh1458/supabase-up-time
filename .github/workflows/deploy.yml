name: Deploy Supabase Stack

on:
  push:
    branches:
      - dev
      - main

jobs:
  test_and_deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Basic Tests
        shell: powershell
        run: |
          echo "Running tests..."
          # Mock test step
          python -c "assert True, 'Tests passed'"
          echo "Tests passed."

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        shell: powershell
        env:
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
        run: |
          echo "Deploying to Dev environment..."
          cd dev
          Copy-Item C:\Users\ADMIN\Desktop\aws_hackthon\supabase-uptime-demo\dev\.env .\.env -ErrorAction SilentlyContinue
          docker compose up -d
          echo "Dev deployed."

      - name: Deploy to Prod
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          echo "Deploying to Prod environment..."
          cd prod
          Copy-Item C:\Users\ADMIN\Desktop\aws_hackthon\supabase-uptime-demo\prod\.env .\.env -ErrorAction SilentlyContinue
          # Rollback preparation step: copy current state if rollback is needed
          Copy-Item docker-compose.yml docker-compose.yml.bak -ErrorAction SilentlyContinue
          
          # Bring up new stack
          docker compose up -d --build
          
          echo "Verifying prod deployment..."
          sleep 10
          $status = docker inspect -f '{{.State.Running}}' prod-supabase-rest-1
          if ($status -notmatch "true") {
            echo "Prod deployment failed, rolling back!"
            Move-Item -Force docker-compose.yml.bak docker-compose.yml
            docker compose up -d
            exit 1
          }
          
          echo "Prod deployed successfully."

      - name: Apply Database Migrations
        shell: powershell
        run: |
          echo "Applying migrations..."
          # In a real setup, we would use Supabase CLI:
          # supabase db push --db-url postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5433/postgres
          echo "Simulating migration push..."
          Get-ChildItem -Path supabase/migrations/

